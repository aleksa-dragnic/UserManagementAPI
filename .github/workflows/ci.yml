name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only by default. No step writes to the repository; Codecov receives
# its token as a secret, not through the workflow token.
permissions:
  contents: read

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UserManagementAPI.sln

      - name: Build
        run: dotnet build UserManagementAPI.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test UserManagementAPI.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      # Migrations are applied by hand to a deployed database (docs/DATABASE.md).
      # An idempotent script per build makes that step reviewable: it can be
      # read, and run, without the SDK. The design-time factory needs a
      # connection string to build options; nothing connects.
      - name: Script the migrations
        env:
          ConnectionStrings__Migrations: Host=localhost;Database=unused
        run: >
          dotnet tool restore &&
          dotnet dotnet-ef migrations script
          --idempotent
          --no-build
          --configuration Release
          --project src/UserManagementAPI.Infrastructure
          --startup-project src/UserManagementAPI.Api
          --output ./artifacts/migrations.sql

      - name: Upload the migration script
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migrations
          path: ./artifacts/migrations.sql
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ./artifacts/test-results
          retention-days: 7

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./artifacts/test-results
          fail_ci_if_error: false

      - name: Build the container image
        run: docker build --tag usermanagementapi:${{ github.sha }} .
