# Weekly, grouped, and aimed at main. Ungrouped NuGet updates on a solution
# this size produce a dozen pull requests a week, which is how people learn to
# ignore them.
#
# The github-actions ecosystem is the one that earns its keep here: the Node 20
# runtime removal that broke nothing only because it was caught by hand would
# have arrived as a pull request months earlier.
version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # A dependency can match more than one group, and when it does it goes into
    # every one of them - order is not precedence. Microsoft.NET.Test.Sdk
    # matched both "Microsoft.NET.Test.Sdk" here and "Microsoft.*" below, so two
    # pull requests edited the same two lines of Directory.Packages.props and
    # the second one conflicted. The broad group excludes what the narrow ones
    # already claim.
    groups:
      testing:
        patterns:
          - "xunit*"
          - "NSubstitute"
          - "Testcontainers*"
          - "coverlet.collector"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Mvc.Testing"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
          - "Npgsql.OpenTelemetry"
      versioning:
        patterns:
          - "Asp.Versioning*"
      framework:
        patterns:
          - "Microsoft.*"
          - "System.*"
          - "Npgsql*"
          - "EFCore.*"
        exclude-patterns:
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Mvc.Testing"
          - "Npgsql.OpenTelemetry"

    # FluentAssertions 8 moved from Apache 2.0 to the Xceed Community License:
    # free for non-commercial use, paid for commercial use. Version 7 stays
    # Apache 2.0 and still receives fixes. BUILD-PLAN section 2 already rejects
    # a dependency over licensing constraints, so taking 8 here would have
    # contradicted a decision this repository records. Minor and patch updates
    # inside 7.x are still welcome.
    ignore:
      - dependency-name: "FluentAssertions"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci