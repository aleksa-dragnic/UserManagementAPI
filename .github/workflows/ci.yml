name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Read-only by default. No step writes to the repository; Codecov receives
# its token as a secret, not through the workflow token.
permissions:
  contents: read

# A newer push to the same branch makes the running build pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UserManagementAPI.sln

      - name: Build
        run: dotnet build UserManagementAPI.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test UserManagementAPI.sln
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./artifacts/test-results

      # Migrations are applied by hand to a deployed database (docs/DATABASE.md).
      # An idempotent script per build makes that step reviewable: it can be
      # read, and run, without the SDK. The design-time factory needs a
      # connection string to build options; nothing connects.
      - name: Script the migrations
        env:
          ConnectionStrings__Migrations: Host=localhost;Database=unused
        run: >
          dotnet tool restore &&
          dotnet dotnet-ef migrations script
          --idempotent
          --no-build
          --configuration Release
          --project src/UserManagementAPI.Infrastructure
          --startup-project src/UserManagementAPI.Api
          --output ./artifacts/migrations.sql

      - name: Upload the migration script
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migrations
          path: ./artifacts/migrations.sql
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ./artifacts/test-results
          retention-days: 7

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./artifacts/test-results
          fail_ci_if_error: false

      - name: Build the container image
        run: docker build --tag usermanagementapi:${{ github.sha }} .

      # The image is scanned before anything could ship it (#83). Trivy runs as
      # its own image, pinned by digest like every action here, rather than as a
      # third-party action with this workflow's token. A CRITICAL or HIGH finding
      # that has a fix fails the build; one without a fix is reported, because
      # there is nothing to do about it yet. No suppression file: a finding is
      # fixed, or written down with a reason and an expiry.
      - name: Scan the container image
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          --no-progress
          usermanagementapi:${{ github.sha }}

      # What the image contains, as CycloneDX: the OS packages and every NuGet
      # package the published app carries, with versions.
      - name: Write the SBOM
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD/artifacts:/out"
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          image
          --format cyclonedx
          --output /out/sbom.cdx.json
          --no-progress
          usermanagementapi:${{ github.sha }}

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: ./artifacts/sbom.cdx.json
          retention-days: 30
