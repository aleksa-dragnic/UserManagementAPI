services:
  db:
    image: postgres:17-alpine
    container_name: umapi-db
    environment:
      POSTGRES_USER: umapi
      POSTGRES_PASSWORD: umapi
      POSTGRES_DB: umapi
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umapi -d umapi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: umapi-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=umapi;Username=umapi;Password=umapi"
      # Local stack only. These values never leave this file: the deployed
      # instance gets its own from the platform's secret store.
      Jwt__SigningKey: "local-compose-signing-key-not-for-any-other-environment-0123456789abcdef"
      Seed__AdministratorPassword: "Admin-Local-Compose-2026!"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel:4317"
    ports:
      - "8080:8080"

  # One container holding an OTLP collector, Prometheus, Tempo and Grafana, so a
  # request can be followed from the HTTP span into the SQL it ran. Development
  # only — a deployed instance points OTEL_EXPORTER_OTLP_ENDPOINT at whatever
  # collector it has, or leaves it unset and exports nothing.
  otel:
    image: grafana/otel-lgtm:latest
    container_name: umapi-otel
    ports:
      - "3000:3000"
      - "4317:4317"

volumes:
  db-data: