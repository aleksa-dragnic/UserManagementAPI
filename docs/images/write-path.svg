<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>UserManagementAPI request paths</title>
  <defs>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="420" fill="#ffffff"/>
  <text x="24" y="34" font-size="17" font-weight="600" fill="#0f172a">Write path and read path</text>
  <text x="24" y="56" font-size="13" fill="#475569">A command goes through the aggregate. A query never does.</text>

  <text x="24" y="92" font-size="13" font-weight="600" fill="#1e1b4b">POST /api/v1/users</text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="24" y="104" width="150" height="38" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="99" y="128" text-anchor="middle">UsersController</text>
    <rect x="198" y="104" width="150" height="38" rx="6" fill="#ecfeff" stroke="#0891b2"/>
    <text x="273" y="122" text-anchor="middle">Dispatcher</text>
    <text x="273" y="136" text-anchor="middle" font-size="10" fill="#0e7490">log, validate, transact</text>
    <rect x="372" y="104" width="150" height="38" rx="6" fill="#ecfeff" stroke="#0891b2"/>
    <text x="447" y="128" text-anchor="middle">Command handler</text>
    <rect x="546" y="104" width="190" height="38" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="641" y="122" text-anchor="middle">User.Register(...)</text>
    <text x="641" y="136" text-anchor="middle" font-size="10" fill="#15803d">invariants, domain event</text>

    <rect x="198" y="176" width="150" height="38" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="273" y="200" text-anchor="middle">201 + Location</text>
    <rect x="372" y="176" width="150" height="38" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="447" y="194" text-anchor="middle">SaveChanges</text>
    <text x="447" y="208" text-anchor="middle" font-size="10" fill="#c2410c">events, audit, outbox</text>
    <rect x="546" y="176" width="190" height="38" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="641" y="200" text-anchor="middle">PostgreSQL — one transaction</text>
  </g>

  <line x1="174" y1="123" x2="192" y2="123" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
  <line x1="348" y1="123" x2="366" y2="123" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
  <line x1="522" y1="123" x2="540" y2="123" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
  <path d="M 641 142 L 641 172" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
  <line x1="540" y1="195" x2="526" y2="195" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
  <line x1="366" y1="195" x2="352" y2="195" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>

  <line x1="24" y1="252" x2="736" y2="252" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="24" y="288" font-size="13" font-weight="600" fill="#1e1b4b">GET /api/v1/users?pageSize=10&amp;orderBy=email</text>
  <g font-size="11.5" fill="#0f172a">
    <rect x="24" y="300" width="150" height="38" rx="6" fill="#eef2ff" stroke="#6366f1"/>
    <text x="99" y="324" text-anchor="middle">UsersController</text>
    <rect x="198" y="300" width="150" height="38" rx="6" fill="#ecfeff" stroke="#0891b2"/>
    <text x="273" y="318" text-anchor="middle">Dispatcher</text>
    <text x="273" y="332" text-anchor="middle" font-size="10" fill="#0e7490">log, validate</text>
    <rect x="372" y="300" width="150" height="38" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="447" y="318" text-anchor="middle">Query handler</text>
    <text x="447" y="332" text-anchor="middle" font-size="10" fill="#c2410c">AsNoTracking, Select</text>
    <rect x="546" y="300" width="190" height="38" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="641" y="324" text-anchor="middle">PostgreSQL — DTO columns only</text>

    <rect x="24" y="360" width="498" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="273" y="382" text-anchor="middle" font-size="11">200 OK + ETag + X-Pagination — no aggregate, no repository</text>
  </g>

  <line x1="174" y1="319" x2="192" y2="319" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
  <line x1="348" y1="319" x2="366" y2="319" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
  <line x1="522" y1="319" x2="540" y2="319" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
  <path d="M 99 338 L 99 356" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#flow)"/>
</svg>
