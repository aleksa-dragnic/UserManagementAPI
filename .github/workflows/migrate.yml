name: Migrate database

# Applies the EF Core migrations to the deployed database (Neon) with
# `dotnet ef database update`, over the direct connection (docs/DATABASE.md). The service does not migrate on startup, and on
# 2026-11-24 code reached production before its tables did: every login was a
# 500. This runs when a migration reaches main, and by hand.
#
# Render deploys the same push, but /health/ready fails while a migration is
# unapplied (PendingMigrationsHealthCheck), so the previous version keeps
# serving until this has run. Migrations are additive first - a column is
# dropped only in a later deploy than the code that stops using it - so the
# previous version is safe on the new schema.
#
# Needs the repository secret DATABASE_MIGRATIONS_URL: the direct (not pooled)
# Neon connection string in the key=value form the repository uses everywhere,
# `Host=...;Database=...;Username=...;Password=...;SSL Mode=Require`. One pair
# of surrounding quotes is tolerated; a postgresql:// URL is refused with a
# message. The maintainer sets it. (The first version ran psql, which reads
# neither form; its two runs stopped before touching the database.)

on:
  push:
    branches: [ main ]
    paths:
      - src/UserManagementAPI.Infrastructure/Migrations/**
      - .github/workflows/migrate.yml
  workflow_dispatch:

permissions:
  contents: read

# Two runs against one database wait for each other; neither is cancelled.
concurrency:
  group: migrate-database
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Require the connection string
        env:
          DATABASE_MIGRATIONS_URL: ${{ secrets.DATABASE_MIGRATIONS_URL }}
        run: |
          if [ -z "$DATABASE_MIGRATIONS_URL" ]; then
            echo "::error::The repository secret DATABASE_MIGRATIONS_URL is not set (see the comment at the top of this workflow)."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore UserManagementAPI.sln

      - name: Apply
        env:
          RAW: ${{ secrets.DATABASE_MIGRATIONS_URL }}
        run: |
          value="${RAW#\"}"
          value="${value%\"}"
          case "$value" in
            postgres://*|postgresql://*)
              echo "::error::DATABASE_MIGRATIONS_URL is a URL; set it in the key=value form: Host=...;Database=...;Username=...;Password=...;SSL Mode=Require"
              exit 1
              ;;
          esac
          # The log masks the secret as stored; the unquoted value is another
          # string, so it is masked too before anything could print it.
          echo "::add-mask::$value"
          export ConnectionStrings__Migrations="$value"
          dotnet tool restore
          dotnet dotnet-ef database update \
            --configuration Release \
            --project src/UserManagementAPI.Infrastructure \
            --startup-project src/UserManagementAPI.Api
          echo "Applied, newest last:"
          dotnet dotnet-ef migrations list \
            --no-build \
            --configuration Release \
            --project src/UserManagementAPI.Infrastructure \
            --startup-project src/UserManagementAPI.Api | tail -3
