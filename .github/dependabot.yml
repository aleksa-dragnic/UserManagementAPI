# Weekly, grouped, and aimed at main. Ungrouped NuGet updates on a solution
# this size produce a dozen pull requests a week, which is how people learn to
# ignore them.
#
# The github-actions ecosystem is the one that earns its keep here: the Node 20
# runtime removal that broke nothing only because it was caught by hand would
# have arrived as a pull request months earlier.
version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Belgrade
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # A dependency can match more than one group, and when it does it goes into
    # every one of them - order is not precedence. Microsoft.NET.Test.Sdk
    # matched both "Microsoft.NET.Test.Sdk" here and "Microsoft.*" below, so two
    # pull requests edited the same two lines of Directory.Packages.props and
    # the second one conflicted. The broad group excludes what the narrow ones
    # already claim.
    #
    # Every group takes minor and patch updates only. A major version is a
    # decision rather than an update, so it arrives in a pull request of its
    # own (Scalar 3 and Serilog 11 did, and both needed reading before they
    # could be taken). "libraries" names the packages no other group claims:
    # without it Scalar alone opened a pull request per patch release, and
    # each was superseded by the next before anyone merged it.
    groups:
      testing:
        update-types: [minor, patch]
        patterns:
          - "xunit*"
          - "NSubstitute"
          - "Testcontainers*"
          - "coverlet.collector"
          - "FluentAssertions"
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Mvc.Testing"
      opentelemetry:
        update-types: [minor, patch]
        patterns:
          - "OpenTelemetry*"
          - "Npgsql.OpenTelemetry"
      versioning:
        update-types: [minor, patch]
        patterns:
          - "Asp.Versioning*"
      framework:
        update-types: [minor, patch]
        patterns:
          - "Microsoft.*"
          - "System.*"
          - "Npgsql*"
          - "EFCore.*"
        exclude-patterns:
          - "Microsoft.NET.Test.Sdk"
          - "Microsoft.AspNetCore.Mvc.Testing"
          - "Npgsql.OpenTelemetry"
      libraries:
        update-types: [minor, patch]
        patterns:
          - "Scalar.*"
          - "Serilog*"
          - "FluentValidation*"
          - "Riok.Mapperly"
          - "Konscious.*"

    # FluentAssertions 8 moved from Apache 2.0 to the Xceed Community License:
    # free for non-commercial use, paid for commercial use. Version 7 stays
    # Apache 2.0 and still receives fixes. BUILD-PLAN section 2 already rejects
    # a dependency over licensing constraints, so taking 8 here would have
    # contradicted a decision this repository records. Minor and patch updates
    # inside 7.x are still welcome.
    ignore:
      - dependency-name: "FluentAssertions"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    # CodeQL's init and analyze actions are one release and must move
    # together, majors included: as two pull requests each ran a different
    # version and "Analyze C#" failed on both (#98/#99, #103/#104). Every other
    # action is grouped for minor and patch; a major comes on its own.
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      actions:
        update-types: [minor, patch]
        patterns:
          - "*"
        exclude-patterns:
          - "github/codeql-action*"

  # The Dockerfile pins both base images by digest (#83). This moves the
  # digests when Microsoft publishes a patched image; the SDK and the runtime
  # come together so a build never mixes two servicing releases. A new major
  # (.NET 11) is a decision, not an update.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
    groups:
      dotnet-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
