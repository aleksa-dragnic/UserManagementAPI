name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Monday morning, so a query set updated during the week is applied to the
    # whole codebase and not only to whatever a pull request happened to touch.
    - cron: '21 4 * * 1'

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      # Stated rather than autobuilt. Autobuild infers how a project is built,
      # and under central package management that inference is unreliable; the
      # build here is two commands, so there is nothing to infer.
      - name: Build
        run: |
          dotnet restore UserManagementAPI.sln
          dotnet build UserManagementAPI.sln --no-restore --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"